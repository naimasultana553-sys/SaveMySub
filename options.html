<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SaveMySub Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      padding: 20px;
      text-align: center;
    }
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: var(--primary-color);
    }
    .sub-list {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .sub-list th, .sub-list td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }
    input[type="text"], input[type="password"] {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
    }
    .settings-section {
      margin-top: 40px;
      padding: 20px;
      border-top: 2px solid var(--border-color);
    }
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>SaveMySub Dashboard</h1>
      <button id="theme-toggle" class="btn btn-secondary">Toggle Dark Mode</button>
    </div>

    <div class="dashboard-grid">
      <div class="card stat-card">
        <div>Monthly Spending</div>
        <div id="monthly-total" class="stat-value">$0.00</div>
      </div>
      <div class="card stat-card">
        <div>Yearly Spending</div>
        <div id="yearly-total" class="stat-value">$0.00</div>
      </div>
      <div class="card stat-card">
        <div>Active Subscriptions</div>
        <div id="active-count" class="stat-value">0</div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="search-input" placeholder="Search subscriptions...">
      <button id="export-btn" class="btn btn-secondary">Export JSON</button>
    </div>

    <div class="card">
      <table class="sub-list">
        <thead>
          <tr>
            <th>Service</th>
            <th>Plan</th>
            <th>Price</th>
            <th>Renewal Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="subscription-table-body">
          <!-- Rows injected by JS -->
        </tbody>
      </table>
    </div>

    <div class="settings-section">
      <h2>Settings</h2>
      <div class="settings-group">
        <label for="api-key">Gemini API Key:</label>
        <input type="password" id="api-key" placeholder="Paste your Gemini API key here">
        <button id="save-settings" class="btn btn-primary">Save API Key</button>
        <small style="color: var(--secondary-color);">Get a free key at <a href="https://aistudio.google.com/" target="_blank" style="color: var(--primary-color);">Google AI Studio</a></small>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
